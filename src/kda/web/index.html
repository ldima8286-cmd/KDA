<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KDA</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <span class="brand-mark">KDA</span>
        <span class="brand-sub">esports intelligence</span>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item is-active" data-view="home">
          <svg viewBox="0 0 24 24" class="ico"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg>
          Обзор
        </button>
        <button class="nav-item" data-view="player">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14Z"/></svg>
          Skill Lab
        </button>
        <button class="nav-item" data-view="meta">
          <svg viewBox="0 0 24 24" class="ico"><path d="M4 20h4V10H4v10Zm6 0h4V4h-4v16Zm6 0h4v-7h-4v7Z"/></svg>
          Meta Hub
        </button>
      </nav>

      <div class="rail-foot">
        <div class="game-chip" id="game-chip">
          <span class="dot"></span> Dota 2
        </div>
        <button class="ghost-btn" id="refresh-global">Обновить данные</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <form class="search" id="search-form" autocomplete="off">
          <svg viewBox="0 0 24 24" class="ico search-ico"><path d="M10 4a6 6 0 1 0 3.5 10.9l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
          <input id="search-input" type="text" placeholder="Steam ID или ник игрока — Enter" spellcheck="false" />
          <span class="search-hint">account_id / nickname</span>
        </form>
        <div class="status" id="status"><span class="status-dot"></span><span id="status-text">готов</span></div>
      </header>

      <section class="view" id="view"></section>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
