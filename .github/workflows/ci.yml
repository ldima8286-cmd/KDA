name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        # Core unit tests are Qt-free by design (format + engine + sync client
        # with httpx.MockTransport), so this job skips the heavy PySide6 wheel.
        # The Qt smoke tests run in the separate `ui` job below.
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx
      - name: Byte-compile
        run: python -m compileall -q src
      - name: Unit tests
        run: |
          PYTHONPATH=src python -m unittest -v \
            tests.test_format tests.test_normalize \
            tests.test_opendota_client tests.test_skill_lab

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6
      - name: Install Qt + pytest-qt
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx "PySide6>=6.6" pytest pytest-qt
      - name: Qt offscreen smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: PYTHONPATH=src python -m pytest tests/test_ui_smoke.py -q
